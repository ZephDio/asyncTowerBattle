# The server's local database. `pnpm db:up` starts it, `pnpm db:migrate` applies the migrations.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: atb
      POSTGRES_PASSWORD: atb
      POSTGRES_DB: atb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atb -d atb"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
